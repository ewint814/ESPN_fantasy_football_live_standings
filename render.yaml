services:
  - type: web
    name: fantasy-football-tracker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python fantasy_tracker.py
    envVars:
      - key: ESPN_LEAGUE_ID
        sync: false  # Set in Render dashboard
      - key: ESPN_S2
        sync: false  # Set in Render dashboard for security
      - key: ESPN_SWID
        sync: false  # Set in Render dashboard for security
      - key: PORT
        value: 5000



